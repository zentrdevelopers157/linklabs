  <script>
    (function() {
      var canvas = document.getElementById('particle-canvas');
      if (!canvas) return;
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) { canvas.style.display = 'none'; return; }
      var ctx = canvas.getContext('2d');
      var particles = [];
      var mouse = { x: -1000, y: -1000 };
      var W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      document.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      var isVisible = true;
      var animId = null;
      var count = window.innerWidth < 768 ? 14 : 22;
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          r: Math.random() * 1.2 + 0.5,
          o: Math.random() * 0.3 + 0.1
        });
      }

      function animate() {
        if (!isVisible) { animId = null; return; }
        ctx.clearRect(0, 0, W, H);
        var len = particles.length;
        for (var i = 0; i < len; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;

          var dx = mouse.x - p.x;
          var dy = mouse.y - p.y;
          var distSq = dx * dx + dy * dy;
          if (distSq < 22500) {
            p.x -= dx * 0.005;
            p.y -= dy * 0.005;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + p.o + ')';
          ctx.fill();

          for (var j = i + 1; j < len; j++) {
            var p2 = particles[j];
            var dx2 = p.x - p2.x;
            var dy2 = p.y - p2.y;
            var d2 = dx2 * dx2 + dy2 * dy2;
            if (d2 < 14400) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = 'rgba(255,255,255,' + (0.06 * (1 - Math.sqrt(d2) / 120)) + ')';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        animId = requestAnimationFrame(animate);
      }
      animate();

      if ('IntersectionObserver' in window) {
        var visObs = new IntersectionObserver(function(entries) {
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) { isVisible = true; if (!animId) animate(); }
            else { isVisible = false; if (animId) { cancelAnimationFrame(animId); animId = null; } }
          }
        }, { threshold: 0 });
        visObs.observe(canvas);
      }
    })();
  </script>

  <script>
    /* === Confetti (used on contact-form success) === */
    window.fireConfetti = function (opts) {
      opts = opts || {};
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (window.__confettiRunning) return;
      window.__confettiRunning = true;
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      canvas.width *= dpr; canvas.height *= dpr;
      ctx.scale(dpr, dpr);
      var W = window.innerWidth, H = window.innerHeight;
      var colors = ['#ffffff', '#a7f3d0', '#fde68a', '#fca5a5', '#c4b5fd', '#7dd3fc', '#fbbf24'];
      var shapes = ['square', 'circle', 'tri', 'line'];
      var count = opts.count || 110;
      var parts = [];
      var startX = W / 2, startY = H * 0.35;
      for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 6 + Math.random() * 8;
        var upBias = 0.55 + Math.random() * 0.35;
        parts.push({
          x: startX + (Math.random() - 0.5) * 80,
          y: startY + (Math.random() - 0.5) * 40,
          vx: Math.cos(angle) * speed * (0.4 + Math.random() * 0.6),
          vy: -Math.abs(Math.sin(angle) * speed * upBias) - 3,
          w: 6 + Math.random() * 8,
          h: 3 + Math.random() * 6,
          c: colors[Math.floor(Math.random() * colors.length)],
          s: shapes[Math.floor(Math.random() * shapes.length)],
          r: Math.random() * Math.PI * 2,
          rs: (Math.random() - 0.5) * 0.3,
          life: 0,
          maxLife: 120 + Math.random() * 80
        });
      }
      var start = performance.now();
      function frame(now) {
        var t = now - start;
        ctx.clearRect(0, 0, W, H);
        var alive = 0;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          p.life++;
          if (p.life > p.maxLife) continue;
          alive++;
          p.vy += 0.28;
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.995;
          p.r += p.rs;
          var fade = 1 - (p.life / p.maxLife);
          ctx.save();
          ctx.globalAlpha = Math.max(0, fade);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r);
          ctx.fillStyle = p.c;
          if (p.s === 'circle') {
            ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill();
          } else if (p.s === 'tri') {
            ctx.beginPath(); ctx.moveTo(0, -p.w / 2); ctx.lineTo(p.w / 2, p.w / 2); ctx.lineTo(-p.w / 2, p.w / 2); ctx.closePath(); ctx.fill();
          } else if (p.s === 'line') {
            ctx.fillRect(-p.w / 2, -0.8, p.w, 1.6);
          } else {
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          }
          ctx.restore();
        }
        if (alive > 0 && t < 5000) { requestAnimationFrame(frame); }
        else { cleanup(); }
      }
      function cleanup() {
        window.__confettiRunning = false;
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }
      requestAnimationFrame(frame);
    };
  </script>

  <script>
    (function() {
      var progress = document.getElementById('scroll-progress');
      var navEl = null;
      var heroEl = null;
      var btt = null;
      var ticking = false;
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function loop() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (progress) progress.style.width = (scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0) + '%';

        if (navEl) {
          if (scrollTop > 24) navEl.classList.add('nav-scrolled');
          else navEl.classList.remove('nav-scrolled');
        }

        if (btt) {
          if (scrollTop > 600) btt.classList.add('visible');
          else btt.classList.remove('visible');
        }

        if (heroEl && !reduceMotion) {
          var heroH = heroEl.offsetHeight;
          if (scrollTop < heroH) {
            var p = scrollTop / heroH;
            heroEl.style.setProperty('--py', (p * 80) + 'px');
            heroEl.style.setProperty('--ps', (1 - p * 0.15));
            heroEl.style.setProperty('--po', (1 - p * 1.2));
          }
        }

        var dotsNav = document.getElementById('scroll-dots');
        if (dotsNav) {
          var scrollMid = scrollTop + window.innerHeight / 2;
          var best = null, bestDist = Infinity;
          var sections = ['home','services','work','demos','process','faq','contact-section'];
          for (var i = 0; i < sections.length; i++) {
            var el = document.getElementById(sections[i]);
            if (!el) continue;
            var top = el.offsetTop, bottom = top + el.offsetHeight;
            var dist = Math.abs(scrollMid - (top + el.offsetHeight / 2));
            if (dist < bestDist) { bestDist = dist; best = sections[i]; }
          }
          var buttons = dotsNav.querySelectorAll('.scroll-dot-btn');
          for (var j = 0; j < buttons.length; j++) {
            var btn = buttons[j];
            var isActive = btn.getAttribute('data-label').toLowerCase() === (best === 'contact-section' ? 'contact' : best);
            btn.classList.toggle('active', isActive);
          }
        }

        ticking = false;
      }
      function onScroll() { if (!ticking) { requestAnimationFrame(loop); ticking = true; } }
      window.addEventListener('scroll', onScroll, { passive: true });

      function init() {
        navEl = document.querySelector('nav[data-nav]');
        heroEl = document.querySelector('section[data-hero]');
        btt = document.getElementById('back-to-top');
        if (btt) {
          btt.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }
        var dotsNav = document.getElementById('scroll-dots');
        if (dotsNav) {
          var sections = [
            { id: 'home', label: 'Home' },
            { id: 'services', label: 'Services' },
            { id: 'work', label: 'Work' },
            { id: 'demos', label: 'Demos' },
            { id: 'process', label: 'Process' },
            { id: 'faq', label: 'FAQ' },
            { id: 'contact-section', label: 'Contact' }
          ];
          sections.forEach(function(s) {
            var btn = document.createElement('button');
            btn.className = 'scroll-dot-btn';
            btn.setAttribute('data-label', s.label);
            btn.setAttribute('aria-label', 'Scroll to ' + s.label);
            btn.addEventListener('click', function() {
              var el = document.getElementById(s.id);
              if (el) window.scrollTo({ top: el.offsetTop, behavior: 'smooth' });
            });
            dotsNav.appendChild(btn);
          });
        }
        loop();
      }

      function setupSpotlight() {
        var cards = document.querySelectorAll('[data-spotlight]');
        for (var i = 0; i < cards.length; i++) {
          (function(card) {
            if (card.__spotlight) return;
            card.__spotlight = true;
            card.addEventListener('mousemove', function(e) {
              var r = card.getBoundingClientRect();
              card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
              card.style.setProperty('--my', (e.clientY - r.top) + 'px');
            });
            card.addEventListener('mouseleave', function() {
              card.style.removeProperty('--mx');
              card.style.removeProperty('--my');
            });
          })(cards[i]);
        }
      }

      function setupMagnetic() {
        var els = document.querySelectorAll('[data-magnetic]');
        for (var i = 0; i < els.length; i++) {
          (function(el) {
            if (el.__magnetic) return;
            el.__magnetic = true;
            var strength = parseFloat(el.getAttribute('data-magnetic')) || 0.25;
            el.addEventListener('mousemove', function(e) {
              var r = el.getBoundingClientRect();
              var x = (e.clientX - r.left - r.width / 2) * strength;
              var y = (e.clientY - r.top - r.height / 2) * strength;
              el.style.setProperty('--tx', x + 'px');
              el.style.setProperty('--ty', y + 'px');
            });
            el.addEventListener('mouseleave', function() {
              el.style.setProperty('--tx', '0px');
              el.style.setProperty('--ty', '0px');
            });
          })(els[i]);
        }
      }

      window.__initCardEffects = function() { setupSpotlight(); setupMagnetic(); };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { init(); setTimeout(setupSpotlight, 50); setTimeout(setupMagnetic, 50); });
      } else {
        init();
        setTimeout(setupSpotlight, 50);
        setTimeout(setupMagnetic, 50);
      }
    })();
  </script>
